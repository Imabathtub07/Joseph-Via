name: Build Bezel Calm (Galaxy Watch app)

on:
  push:
    paths:
      - "bezel-calm/**"
      - "!bezel-calm/BezelCalm.apk"
      - ".github/workflows/bezel-calm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bezel-calm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bezel-calm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BezelCalm-apk
          path: bezel-calm/app/build/outputs/apk/release/app-release.apk

      # Keep a ready-to-install copy next to the source so it can be downloaded straight from GitHub.
      - name: Commit the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk BezelCalm.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BezelCalm.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Build BezelCalm.apk from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
